\u003c/span>\u003cspan>SPACE 再生 / 一時停止　·　ダブルクリック フォーカス\u003c/span>\u003c/footer>\u003c/div>\u003cbutton class=\"escapeview\" id=\"exitView\">✕ 通常モードに戻る\u003c/button>\u003cdiv class=\"toast\" id=\"toast\" role=\"status\">\u003c/div>\u003cinput type=\"file\" id=\"files\" hidden=\"\" multiple=\"\" accept=\"image/*,video/*,.heic,.heif,.mov,.webm,.mp4\">\u003cinput type=\"file\" id=\"project\" hidden=\"\" accept=\".json,.tmw\">\u003cdialog id=\"helpDialog\">\u003ch2>自由に並べ、じっくり見る。\u003c/h2>\u003cp>画像や動画を追加すると、画面を隙間なく分割します。メディアファイルはサーバーへ送信されません。Mac版で保存した .tmw ファイルも「開く」から読み込めます。\u003c/p>\u003cp>① 外からファイルをドラッグ：空の枠ならその枠に追加。画像・動画の四辺に出る線で挿入位置を確認して離します。\u003cbr>② タイル上部の ⠿ をドラッグ：四辺の線で移動、中央の面のハイライトで入れ替え。Escでキャンセル。\u003cbr>③ 仕切りをドラッグして大きさを調整。\u003cbr>④ タイル内をドラッグして表示位置を調整。ホイール・ピンチでズーム。\u003c/p>\u003cp>動画を選択して編集パネルで区間を追加し、再生順を組み立てます。区間ボタンは繰り返し追加でき、順序リスト内の矢印で並べ替えます。チェックを外した区間は一時的にスキップ。区間がない動画は全体をループできます。\u003c/p>\u003cp>⌘S / Ctrl+S：保存　⌘O / Ctrl+O：開く\u003cbr>⌘Z / Ctrl+Z：元に戻す　Space：一斉再生・停止\u003cbr>閲覧モード：タッチで操作表示。右上の「通常モードに戻る」で終了。操作終了から3秒で操作表示を隠します。\u003cbr>Esc：フォーカス・全画面・閲覧モードを解除\u003c/p>\u003cp class=\"tiny\">対応形式の再生可否はブラウザとコーデックに依存します。HEIC・MOVで表示できない場合はJPEG・H.264のMP4に変換してください。PiPは対応ブラウザのみ。画像のPiPは対応するウィンドウAPIがある場合に利用できます。自動保存はこのブラウザ・このサイト内だけに保存されます。Mac版や別ブラウザとは自動同期しません。ブラウザのデータ消去で失われるため、.tmwファイルも書き出してください。\u003c/p>\u003cdiv class=\"row\">\u003cbutton class=\"primary\" id=\"closeHelp\">わかった\u003c/button>\u003c/div>\u003c/dialog>\n\u003cdialog id=\"saveDialog\">\u003ch2>ワークスペースを保存\u003c/h2>\u003cp>配置・表示位置・区間ループ・メモをまとめて書き出します。\u003c/p>\n\u003cdiv class=\"row\" style=\"margin-top:0;margin-bottom:15px\">\u003cinput type=\"text\" id=\"exportFilename\" placeholder=\"ファイル名 (省略した場合は日付)\" style=\"flex:1\">\u003c/div>\n\u003clabel>\u003cinput type=\"checkbox\" id=\"includeMedia\" checked=\"\"> 画像・動画ファイルも含める（Mac版や別ブラウザへ引き継ぐ）\u003c/label>\u003cp class=\"tiny\">含めると、Mac版や別のブラウザでも同じワークスペースを開けます。含めない場合は元ファイルの再追加が必要です。大きな動画を含めると保存ファイルの作成に時間とメモリが必要です。\u003c/p>\u003cdiv class=\"row\">\u003cbutton class=\"primary\" id=\"export\">書き出す\u003c/button>\u003cbutton id=\"cancelSave\">キャンセル\u003c/button>\u003c/div>\u003c/dialog>\n\u003cdiv id=\"startupNotice\" role=\"status\" style=\"position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);max-width:520px;padding:20px;color:#edf3f3;background:#1d2225;border:1px solid #343b40;border-radius:12px;z-index:99\">起動しています…。画面が切り替わらない場合は、配布ファイルの OPEN-ME.html または公開URLから開いてください。\u003c/div>\n\u003cscript>(function(){\n  let ready=false;\n  const notice=document.getElementById('startupNotice');\n  function failed(){if(ready||!notice)return;notice.hidden=false;notice.textContent='アプリを起動できませんでした。配布ファイルの OPEN-ME.html を開くか、公開URLを利用してください。'}\n  window.addEventListener('tmw-ready',()=>{ready=true;clearTimeout(timer);if(notice)notice.remove()},{once:true});\n  window.addEventListener('error',failed,{once:true});\n  const timer=setTimeout(failed,6000);\n})();\n\u003c/script>\n\u003cscript>/* Shared browser/Electron geometry and immutable layout operations. */\n(function(root,factory){\n  if(typeof module==='object'&&module.exports)module.exports=factory();\n  else root.Layout=factory();\n})(typeof globalThis!=='undefined'?globalThis:this,()=>{\n  function zone(r,x,y,allowSwap=false,empty=false){\n    if(empty)return 'fill';\n    const nx=(x-r.left)/r.width,ny=(y-r.top)/r.height;\n    if(allowSwap&&nx>=.25&&nx\u003c=.75&&ny>=.25&&ny\u003c=.75)return 'center';\n    const edges=[['left',Math.abs(x-r.left)],['right',Math.abs(r.left+r.width-x)],['top',Math.abs(y-r.top)],['bottom',Math.abs(r.top+r.height-y)]];\n    return edges.reduce((a,b)=>b[1]\u003ca[1]?b:a)[0];\n  }\n  function replace(t,id,n){if(!t)return t;if(t.id)return t.id===id?n:t;return {...t,a:replace(t.a,id,n),b:replace(t.b,id,n)}}\n  function remove(t,id){if(!t)return null;if(t.id)return t.id===id?null:t;const a=remove(t.a,id),b=remove(t.b,id);return !a?b:!b?a:{...t,a,b}}\n  function insertBeside(tree,id,node,edge){\n    if(!['left','right','top','bottom'].includes(edge))throw new Error('Invalid insertion edge');\n    const before=edge==='left'||edge==='top';\n    return replace(tree,id,{axis:edge==='left'||edge==='right'?'x':'y',ratio:.5,a:before?node:{id},b:before?{id}:node});\n  }\n  function contains(t,id){return !!t&&(t.id?t.id===id:contains(t.a,id)||contains(t.b,id))}\n  function move(tree,src,dst,edge){\n    if(src===dst||!contains(tree,src)||!contains(tree,dst))return tree;\n    if(edge==='center'){\n      function swap(t){return t.id?{id:t.id===src?dst:t.id===dst?src:t.id}:{...t,a:swap(t.a),b:swap(t.b)}}\n      return swap(tree);\n    }\n    return insertBeside(remove(tree,src),dst,{id:src},edge);\n  }\n  return {zone,insertBeside,move};\n});\n\u003c/script>\n\u003cscript>\n'use strict';\nconst $=s=>document.querySelector(s), uid=()=>crypto.randomUUID(), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), esc=s=>String(s).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst board=$('#board'), panel=$('#panel'), views=new Map(), blobs=new Map(), urls=new Map();\nlet pendingFill=null,viewTimer=null,suppressWakeClick=false;const activePointers=new Set();\nlet state={version:1,items:[],tree:null,selected:null,sync:false}, past=[],future=[],focusId=null,fullId=null,panelOpen=false,drawMode='pan',db=null,saveTimer=null,saving=Promise.resolve(),toastTimer,routeIndex=new Map();\nfunction toast(s){$('#toast').textContent=s;$('#toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').style.display='none',4500)}\nconst item=id=>state.items.find(m=>m.id===id); const video=id=>views.get(id)?.querySelector('video'); const snapshot=()=>JSON.stringify(state);\nfunction checkpoint(){past.push(snapshot());if(past.length>50)past.shift();future=[];historyButtons()}\nfunction updateMuteLabel(){const audible=state.items.some(m=>m.type==='video'&&!m.muted);$('#muteAll').textContent=audible?'すべて消音':'消音を解除';$('#muteAll').disabled=!state.items.some(m=>m.type==='video')}\nfunction historyButtons(){$('#undo').disabled=!past.length;$('#redo').disabled=!future.length}\nfunction undo(redo=false){const from=redo?future:past,to=redo?past:future;if(!from.length)return;to.push(snapshot());state=JSON.parse(from.pop());focusId=null;fullId=null;routeIndex.clear();render();persist()}\n\nlet isDraggingPanel = false;\nlet dragStart = { x: 0, y: 0, left: 0, top: 0 };\npanel.addEventListener('pointerdown', e => {\n    if (e.button !== 0 || !e.target.closest('.panel-drag-handle') || matchMedia('(max-width:600px)').matches) return;\n    e.preventDefault();\n    isDraggingPanel = true;\n    panel.setPointerCapture(e.pointerId);\n    const rect = panel.getBoundingClientRect();\n    const bodyRect = document.querySelector('.body').getBoundingClientRect();\n    dragStart = { x: e.clientX, y: e.clientY, left: rect.left - bodyRect.left, top: rect.top - bodyRect.top };\n});\npanel.addEventListener('pointermove', e => {\n    if (!isDraggingPanel) return;\n    const bodyRect = document.querySelector('.body').getBoundingClientRect();\n    const rect = panel.getBoundingClientRect();\n    let newLeft = dragStart.left + (e.clientX - dragStart.x);\n    let newTop = dragStart.top + (e.clientY - dragStart.y);\n    newLeft = clamp(newLeft, 0, Math.max(0, bodyRect.width - rect.width));\n    newTop = clamp(newTop, 0, Math.max(0, bodyRect.height - 44));\n    panel.style.left = newLeft + 'px';\n    panel.style.top = newTop + 'px';\n});\nconst endPanelDrag = e => {\n    if (!isDraggingPanel) return;\n    isDraggingPanel = false;\n    if (panel.hasPointerCapture(e.pointerId)) panel.releasePointerCapture(e.pointerId);\n};\npanel.addEventListener('pointerup', endPanelDrag);\npanel.addEventListener('pointercancel', endPanelDrag);\n\nfunction leaf(id){return {id}} function leaves(t){return !t?[]:t.id?[t.id]:[...leaves(t.a),...leaves(t.b)]}\nfunction replace(t,id,n){if(!t)return n;if(t.id)return t.id===id?n:t;return {...t,a:replace(t.a,id,n),b:replace(t.b,id,n)}}\nfunction remove(t,i
