集パネル\u003c/button>\u003c/div>\u003c/div>\u003cmain class=\"body\">\u003csection class=\"workspace\" id=\"workspace\" aria-label=\"メディアボード\">\u003cdiv class=\"board\" id=\"board\">\u003cdiv class=\"empty\">\u003cdiv class=\"art\">\u003cdiv>\u003c/div>\u003cdiv>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/div>\u003c/div>\u003cspan class=\"panel-title\">A PLACE FOR EVERY FRAME\u003c/span>\u003ch1>好きな景色を、ひとつの画面に。\u003c/h1>\u003cp>画像も動画も、自由に敷き詰める。\u003cbr>ドラッグで配置。ズームで切り取る。何度でも見返す。\u003c/p>\u003cdiv class=\"row\">\u003cbutton class=\"primary\" id=\"emptyAdd\">＋ 画像・動画を選ぶ\u003c/button>\u003cbutton id=\"demo\">サンプルで試す\u003c/button>\u003c/div>\u003cdiv class=\"keys\">ファイルをここにドロップしても追加できます\u003c/div>\u003cimg alt=\"apple-touch-icon.png\" decoding=\"async\" loading=\"lazy\" id=\"vb-image-1\" src=\"apple-touch-icon.png\" data-vb-persist-added=\"1\" data-vb-persist-parent=\"div.app:nth-of-type(1) &gt; main.body &gt; section.workspace &gt; div.board:nth-of-type(1) &gt; div.empty\" style=\"width: 239.978px !important; height: auto; max-width: 100%; display: block; position: absolute; margin: 0px; left: 477.254px; top: 71.32px; z-index: 1; right: auto !important;\" class=\"\" data-vb-layout-key=\"layout-1\">\u003c/div>\u003c/div>\u003cdiv class=\"dropzone\" id=\"dropzone\">ここに画像・動画をドロップ\u003c/div>\u003c/section>\u003caside class=\"sidebar hidden\" id=\"panel\" aria-label=\"選択タイルの編集\">\u003c/aside>\u003c/main>\u003cfooter class=\"statusbar\">\u003cspan id=\"saveStatus\">端末内に自動保存\u003c/span>\u003cspan id=\"selectionStatus\">メディア未選択\u003c/span>\u003cspan>SPACE 再生 / 停止　·　ダブルクリック フォーカス\u003c/span>\u003c/footer>\u003c/div>\u003cbutton class=\"escapeview\" id=\"exitView\">閲覧モードを終了\u003c/button>\u003cdiv class=\"toast\" id=\"toast\" role=\"status\">\u003c/div>\u003cinput type=\"file\" id=\"files\" hidden=\"\" multiple=\"\" accept=\"image/*,video/*,.heic,.heif,.mov,.webm,.mp4\">\u003cinput type=\"file\" id=\"project\" hidden=\"\" accept=\".json,.tmw\">\u003cdialog id=\"helpDialog\">\u003ch2>自由に並べ、じっくり見る。\u003c/h2>\u003cp>画像や動画を追加すると、画面を隙間なく分割します。メディアファイルはサーバーへ送信されません。\u003c/p>\u003cp>① タイル上部の名前をドラッグ。中央で入れ替え、上下左右の端で分割配置。\u003cbr>② 仕切りをドラッグして大きさを調整。\u003cbr>③ タイル内をドラッグして表示位置を調整。ホイール・ピンチでズーム。\u003c/p>\u003cp>動画を選択して編集パネルで区間を追加し、再生順を組み立てます。区間ボタンは繰り返し追加でき、順序リスト内の矢印で並べ替えます。\u003c/p>\u003cp>⌘Z / Ctrl+Z：元に戻す　Space：一斉再生・停止\u003cbr>Esc：フォーカス・全画面・閲覧モードを解除\u003c/p>\u003cp class=\"tiny\">対応形式の再生可否はブラウザとコーデックに依存します。HEIC・MOVで表示できない場合はJPEG・H.264のMP4に変換してください。PiPは対応ブラウザのみ。画像のPiPは対応するウィンドウAPIがある場合に利用できます。端末内保存はブラウザのデータ消去で失われるため、保存ファイルも書き出してください。\u003c/p>\u003cdiv class=\"row\">\u003cbutton class=\"primary\" id=\"closeHelp\">わかった\u003c/button>\u003c/div>\u003c/dialog>\u003cdialog id=\"saveDialog\">\u003ch2>ワークスペースを保存\u003c/h2>\u003cp>配置・表示位置・区間ループ・メモをまとめて書き出します。\u003c/p>\u003clabel>\u003cinput type=\"checkbox\" id=\"includeMedia\"> 画像・動画ファイルも含める\u003c/label>\u003cp class=\"tiny\">含めない場合、別の端末では元のメディアを再追加してください。大きな動画を含めると保存ファイルの作成に時間とメモリが必要です。\u003c/p>\u003cdiv class=\"row\">\u003cbutton class=\"primary\" id=\"export\">書き出す\u003c/button>\u003cbutton id=\"cancelSave\">キャンセル\u003c/button>\u003c/div>\u003c/dialog>\n\u003cscript>\n'use strict';\nconst $=s=>document.querySelector(s), uid=()=>crypto.randomUUID(), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), esc=s=>String(s).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst board=$('#board'), panel=$('#panel'), views=new Map(), blobs=new Map(), urls=new Map();\nlet state={version:1,items:[],tree:null,selected:null,sync:false}, past=[],future=[],focusId=null,fullId=null,panelOpen=false,drawMode='pan',db=null,saveTimer=null,saving=Promise.resolve(),toastTimer,routeIndex=new Map();\nfunction toast(s){$('#toast').textContent=s;$('#toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').style.display='none',4500)}\nconst item=id=>state.items.find(m=>m.id===id); const video=id=>views.get(id)?.querySelector('video'); const snapshot=()=>JSON.string fit:'cover',mirror:false,brightness:100,contrast:100,gray:0,muted:true,rate:1,ranges:[],route:[],loop:false,notes:[],annotations:[]}}\nasync function initDB(){return new Promise((resolve,reject)=>{const q=indexedDB.open('tile-media-workspace-v1',1);q.onupgradeneeded=()=>{q.result.createObjectStore('media');q.result.createObjectStore('workspace')};q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}\nasync function dbGet(store,key){return new Promise((resolve,reject)=>{const t=db.transaction(store),q=t.objectStore(store).get(key);q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}\nasync function dbPut(store,key,value){if(!db)return;return new Promise((resolve,reject)=>{const t=db.transaction(store,'readwrite');t.objectStore(store).put(value,key);t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error)})}\nfunction persist(){clearTimeout(saveTimer);$('#saveStatus').textContent='保存中…';saveTimer=setTimeout(()=>{const s=JSON.parse(snapshot());saving=saving.catch(()=>{}).then(()=>dbPut('workspace','current',s)).then(()=>{$('#saveStatus').textContent=db?'端末内に自動保存済み':'保存ファイルを書き出してください'}).catch(()=>{$('#saveStatus').textContent='自動保存できません';toast('端末の保存容量を確認し、保存ファイルを書き出してください')})},350)}\nasync function attachBlob(id,file){if(urls.has(id))URL.revokeObjectURL(urls.get(id));blobs.set(id,file);urls.set(id,URL.createObjectURL(file));try{await dbPut('media',id,file)}catch{toast('メディアの自動保存に失敗しました。保存ファイルに含めて書き出してください')}const v=views.get(id);if(v){v._observer?.disconnect();v.remove();views.delete(id)}}\nfunction mediaKind(f){if(f.type.startsWith('image/')||/\\.(jpe?g|png|webp|gif|svg|heic|heif)$/i.test(f.name))return 'image';if(f.type.startsWith('video/')||/\\.(mp4|webm|mov|m4v)$/i.test(f.name))return 'video';return null}\nasync function addFiles(files){const valid=[...files].filter(mediaKind);if(!valid.length){toast('画像・動画ファイルを選択してください');return}checkpoint();for(const f of valid){let m=state.items.find(m=>!blobs.has(m.id)&&m.name===f.name&&(!m.size||m.size===f.size));if(!m){m=defaults(uid(),f.name,mediaKind(f));m.size=f.size;m.modified=f.lastModified;state.items.push(m);insert(m.id)}await attachBlob(m.id,f);state.selected=m.id}render();persist();toast(`${valid.length}件のメディアを読み込みました`)}\nfunction select(id,open=false){state.selected=id;if(open)panelOpen=true;for(const [k,v] of views)v.classList.toggle('selected',k===id);renderPanel();$('#selectionStatus').textContent=item(id)?.name||'メディア未選択';persist()}\nfunction fitMedia(m,v){const media=v.querySelector('.media');if(!media)return;const box=v.getBoundingClientRect(),nw=media.videoWidth||media.naturalWidth||1600,nh=media.videoHeight||media.naturalHeight||1000;if(!box.width||!box.height)return;const base=m.fit==='contain'?Math.min(box.width/nw,box.height/nh):Math.max(box.width/nw,box.height/nh),w=nw*base*m.zoom,h=nh*base*m.zoom;m.x=clamp(m.x,-Math.max(0,(w-box.width)/2)/box.width,Math.max(0,(w-box.width)/2)/box.width);m.y=clamp(m.y,-Math.max(0,(h-box.height)/2)/box.height,Math.max(0,(h-box.height)/2)/box.height);Object.assign(media.style,{width:w+'px',height:h+'px',left:(box.width-w)/2+m.x*box.width+'px',top:(box.height-h)/2+m.y*box.height+'px',transform:m.mirror?'scaleX(-1)':'none',filter:`brightness(${m.brightness}%) contrast(${m.contrast}%) grayscale(${m.gray}%)`})}\nfunction renderAnnotations(m,v){const svg=v.querySelector('.annotations');svg.innerHTML=m.annotations.map(a=>a.kind==='arrow'?`\u003cline x1=\"${a.x*1000}\" y1=\"${a.y*1000}\" x2=\"${a.x2*1000}\" y2=\"${a.y2*1000}\" stroke=\"#b3ffdb\" stroke-width=\"5\" marker-end=\"url(#arrow-${m.id})\"/>`:a.kind==='rect'?`\u003crect x=\"${Math.min(a.x,a.x2)*1000}\" y=\"${Math.min(a.y,a.y2)*1000}\" width=\"${Math.abs(a.x2-a.x)*1000}\" height=\"${Math.abs(a.y2-a.y)*1000}\" fill=\"#72dc9a22\" stroke=\"#b3ffdb\" stroke-width=\"4\"/>`:`\u003cpolyline points=\"${a.points.map(p=>p.map(n=>n*1000).join(',')).join(' ')}\" fill=\"none\" stroke=\"#b3ffdb\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-
